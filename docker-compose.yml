# Local development stack.
#
# Postgres and Redis only. The relayer and indexer run on the host, because a
# hackathon spent debugging container networking is a hackathon not spent on the
# proof flow -- and the services need to reach an Ethereum RPC and the Attestcoin
# proof builder either way, so containerising them buys isolation from nothing
# that matters here.
#
# Redis is included but unused by default. The scheduler runs in-process and
# persists to Postgres, so durability is already covered; Redis is here for the
# moment queue depth makes it necessary, not before.
#
#   npm run infra:up      start
#   npm run infra:down    stop
#   docker compose down -v   stop and discard data

name: vouch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch
      POSTGRES_DB: vouch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready rather than a port check: the container accepts connections
      # before the database is ready to serve them, and a migration that starts
      # in that window fails in a way that looks like a schema bug.
      test: ['CMD-SHELL', 'pg_isready -U vouch -d vouch']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    # Scrapes the services on the host. host.docker.internal resolves on Docker
    # Desktop; on Linux the extra_hosts entry below provides it.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
