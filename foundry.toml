[profile.default]
src = "packages/contracts/src"
test = "packages/contracts/test"
out = "packages/contracts/out"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
# CC3's EVM is Frontier-based and does not implement the post-merge PREVRANDAO
# opcode. Foundry defaults to a newer target, which compiles fine and then fails
# at deploy time with "prevrandao not set" -- a runtime error for a compile-time
# setting. London predates the merge and is what the chain actually supports.
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./tests/fixtures" }]

[rpc_endpoints]
creditcoin_testnet = "https://rpc.cc3-testnet.creditcoin.network"
ethereum_mainnet = "${ETH_MAINNET_RPC}"

[profile.default.fuzz]
runs = 512
