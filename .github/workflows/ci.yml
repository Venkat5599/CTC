name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # OpenZeppelin and @gluwa/usc-contracts resolve from node_modules, which
      # foundry.toml lists as a lib path.
      - name: Install Solidity dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Gas report
        run: forge test --gas-report --match-path "packages/contracts/test/Gas.t.sol"

      # The unit suite proves the logic is right. This proves the thing that is
      # actually DEPLOYED is doing what the README says -- no mock, no fixture,
      # forked against Creditcoin CC3 and reading the live contracts at their
      # published addresses. It fails if a documented address, a registered
      # source, or the one proven fact ever drifts from the chain.
      #
      # continue-on-error because a public RPC being briefly unreachable is not
      # a defect in the commit under test. A genuine drift still shows as a
      # failed step in the run, and the unit suite above stays blocking.
      - name: Live contracts (forked CC3)
        continue-on-error: true
        run: |
          forge test --match-contract LiveTest             --fork-url https://rpc.cc3-testnet.creditcoin.network -vv

  security-invariants:
    name: security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Solidity dependencies
        run: npm install --no-audit --no-fund

      # S1, S2 and S3 are the three failure modes the submission's security
      # claim rests on. Running them as their own job means a regression in any
      # one of them is legible in the checks list rather than buried in a
      # 52-line test log.
      - name: S1 - inclusion is not success
        run: forge test --match-test "test_S1_" -vv

      - name: S2 - emitter pinning
        run: forge test --match-test "test_S2_" -vv

      - name: S3 - replay protection
        run: forge test --match-test "test_S3_" -vv

      # Anti-criterion, enforced mechanically: submitBatch must stay
      # permissionless. If someone adds an allowlist or an owner check to the
      # submission path, this fails before review does.
      - name: Submission stays permissionless
        run: forge test --match-test "test_anySenderCanSubmit" -vv

  workspaces:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - packages/config
          - packages/schemas
          - packages/proof-engine
          - packages/attestcoin
          - packages/sdk
          - services/relayer
          - services/indexer
          - services/worker
          - packages/ui
          - apps/web
          - apps/explorer
          - apps/docs
          - apps/demo-credit
          - tests/integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installed from the ROOT, not from the workspace directory. These
      # packages depend on each other through npm workspace links, and a
      # per-directory install cannot resolve "@vouch/proof-engine": "*".
      - name: Install workspace
        run: npm install --no-audit --no-fund

      # The Prisma client is generated code. Nothing that imports it typechecks
      # until it exists, so this runs before, not after.
      - name: Generate Prisma client
        if: matrix.workspace == 'services/indexer'
        run: npm --prefix services/indexer run db:generate

      - name: Typecheck
        run: npm --prefix ${{ matrix.workspace }} run typecheck

      - name: Test
        run: npm --prefix ${{ matrix.workspace }} run test --if-present

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed keys
        run: |
          # Matches key MATERIAL, not the word. An earlier version matched any
          # assignment to PRIVATE_KEY and failed on a `0x...` placeholder in
          # deployment docs -- and a scanner that cries wolf on documentation is
          # a scanner somebody disables, at which point it protects nothing.
          #
          # A secp256k1 private key is 64 hex characters. A BIP-39 mnemonic is
          # twelve or more lowercase words. Both are matched precisely; neither
          # placeholders nor prose can trip them.
          fail=0

          if git grep -nIE '(PRIVATE_KEY|SECRET_KEY)[[:space:]]*[=:][[:space:]]*.?(0x)?[0-9a-fA-F]{64}'                -- ':!*.example' ':!.github/*'; then
            echo "::error::A 64-hex-character private key appears to be committed."
            fail=1
          fi

          if git grep -nIE 'MNEMONIC[[:space:]]*[=:][[:space:]]*.?([a-z]+ ){11,}[a-z]+'                -- ':!*.example' ':!.github/*'; then
            echo "::error::A BIP-39 mnemonic appears to be committed."
            fail=1
          fi

          # A funded key is useless without an RPC, so a hardcoded endpoint
          # carrying an API key is worth catching in the same pass.
          if git grep -nIE '(infura|alchemy)\.io/v[0-9]/[0-9a-zA-Z]{20,}'                -- ':!*.example' ':!.github/*'; then
            echo "::error::An RPC URL with an embedded API key appears to be committed."
            fail=1
          fi

          if [ "$fail" = "1" ]; then exit 1; fi
          echo "No committed keys found."
