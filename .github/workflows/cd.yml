name: CD

# Continuous deployment.
#
# Split from ci.yml because the two answer different questions. CI asks whether
# the code is correct; CD asks whether it is live. Merging them would mean every
# green test run tried to deploy, and every deployment failure looked like a
# test failure.
#
# What deploys automatically and what does not is a deliberate line:
#
#   Frontends deploy on merge. They are stateless, versioned, and a bad one is
#   rolled back by redeploying the previous commit.
#
#   Service images build and publish on merge, but nothing restarts on its own.
#   The relayer holds a queue and a cursor; restarting it mid-batch is safe but
#   not free, and the operator should choose when.
#
#   CONTRACTS NEVER DEPLOY FROM HERE. They are immutable once deployed and
#   source registration writes trust decisions that fail silently when wrong.
#   That lives in deploy.yml behind a manual trigger and a typed confirmation.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deployment per branch at a time. Two racing deploys of the same app
  # produce a live version that matches neither commit.
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Nothing deploys off a red build.
  # ---------------------------------------------------------------------------
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # The security suite specifically, not just the full run. If S1, S2 or S3
      # regressed, the thing about to go live does not do what its own
      # documentation says it does.
      - name: Security invariants
        run: forge test --match-path "packages/contracts/test/Security.t.sol" -vv

      - name: Contracts
        run: forge test

      - name: Services and packages
        run: |
          npm --prefix packages/proof-engine run test
          npm --prefix packages/attestcoin run test
          npm --prefix packages/sdk run test
          npm --prefix services/relayer run test
          npm --prefix services/worker run test

      - name: Integration
        run: npm --prefix tests/integration run test

  # ---------------------------------------------------------------------------
  # Frontends. Vercel, one project per app.
  # ---------------------------------------------------------------------------
  frontends:
    name: ${{ matrix.app }}
    needs: gate
    runs-on: ubuntu-latest
    # Skipped entirely when Vercel is not configured, rather than failing. A
    # fork or a fresh clone should get a green CD run that deploys nothing, not
    # a red one complaining about a secret it was never given.
    if: vars.VERCEL_ENABLED == 'true'
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            alias: vouch-registry.vercel.app
            project_id_secret: VERCEL_PROJECT_ID_WEB
          - app: explorer
            alias: vouch-explorer.vercel.app
            project_id_secret: VERCEL_PROJECT_ID_EXPLORER
          - app: docs
            alias: vouch-protocol-docs.vercel.app
            project_id_secret: VERCEL_PROJECT_ID_DOCS
          - app: demo-credit
            alias: vouch-demo-credit.vercel.app
            project_id_secret: VERCEL_PROJECT_ID_DEMO
    steps:
      # Vercel deployment needs a token this repository may not have. Rather
      # than let four jobs fail red on every push -- which trains everyone to
      # ignore a red CD and hides the failures that matter -- check for the
      # secret first and skip the rest of the job with a notice when it is
      # absent. A deploy that cannot authenticate is not a broken build.
      - name: Check for a deployment token
        id: token
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.app }}::VERCEL_TOKEN is not set, so this app was not deployed. Set it in repository secrets to enable automatic deployment; until then the frontends ship from the CLI."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@latest

      # A pull request gets a preview URL; master gets production. Same command,
      # different target, so the path that ships is the path that was rehearsed
      # on every PR rather than a separate one nobody exercises.
      # Deployed from the REPO ROOT with rootDirectory set on the project, not
      # from the app directory. These apps resolve @vouch/* through npm
      # workspace links, so an upload scoped to apps/<name> cannot install them
      # -- the first attempt failed exactly that way, with npm rejecting a
      # `cd ../..` that reached outside its own build context.
      #
      # Built server-side rather than with --prebuilt, because a local build
      # would ignore the project's rootDirectory and produce output for the
      # wrong tree.
      - name: Deploy
        id: deploy
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          set -o pipefail
          prod=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then prod="--prod"; fi

          vercel deploy --yes $prod --token="${{ secrets.VERCEL_TOKEN }}" | tee deploy.out

          # Matched out of the output rather than taken as the last line. The
          # CLI interleaves progress with the URL, so `tail -1` captured an
          # empty string and the alias step then aliased nothing.
          url=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' deploy.out | tail -1)
          if [ -z "$url" ]; then
            # The usual cause is an OAuth token rather than a project token.
            # An OAuth token passes `vercel whoami` and is then rejected by every
            # project API, so it cannot be validated up front -- the deploy is
            # the first place it fails, and the CLI's message does not say which
            # kind of token it wanted.
            if grep -q "not valid" deploy.out; then
              echo "::error title=${{ matrix.app }}::VERCEL_TOKEN was rejected. Mint a token at vercel.com/account/tokens and set it as the VERCEL_TOKEN repository secret -- an OAuth token will not work here. To turn automatic deployment off instead, set the VERCEL_ENABLED repository variable to false and ship the frontends from the CLI."
            else
              echo "::error title=${{ matrix.app }}::Deploy produced no URL."
            fi
            cat deploy.out
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=${{ matrix.app }}::$url"

      # A Vercel deployment gets a fresh generated URL every time and the
      # stable domain does NOT follow it. Skipping this meant the site was
      # deployed and the public link still served the previous build, which is
      # the most confusing possible failure: everything green, nothing changed.
      - name: Point the stable domain at this deployment
        if: steps.token.outputs.present == 'true' && github.event_name != 'pull_request'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          target=$(echo "${{ steps.deploy.outputs.url }}" | sed 's#^https://##')
          vercel alias set "$target" "${{ matrix.alias }}"             --token="${{ secrets.VERCEL_TOKEN }}"
          echo "::notice title=${{ matrix.app }}::https://${{ matrix.alias }}"

      # A status code is not evidence. Every one of these returned HTTP 200 on
      # its first publish while serving Vercel's login page, because Deployment
      # Protection is on by default -- so a check that only reads the code would
      # have passed and reported four working sites. It reads the title instead.
      - name: Smoke test the deployed URL
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -sL --max-time 20 "https://${{ matrix.alias }}" || true)
            if printf '%s' "$body" | grep -qi '<title>[^<]*Vouch\|<title>[^<]*standing'; then
              echo "Serving real content."
              exit 0
            fi
            if printf '%s' "$body" | grep -qi 'Login . Vercel'; then
              echo "::error title=${{ matrix.app }}::Deployment Protection is on. This URL is gated behind a Vercel login."
              exit 1
            fi
            echo "attempt $attempt: not ready"
            sleep 8
          done
          echo "::error title=${{ matrix.app }}::Deployed but not serving the site."
          exit 1

  # ---------------------------------------------------------------------------
  # Service images. Built and published; not restarted.
  # ---------------------------------------------------------------------------
  images:
    name: image ${{ matrix.service }}
    needs: gate
    # Images are published from master only. A PR proves the Dockerfile builds
    # in the job below without pushing a tag nobody asked for.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [relayer, indexer]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: |
          echo "::notice title=${{ matrix.service }}::Published. Nothing restarted -- roll it out when the queue is quiet."

  # ---------------------------------------------------------------------------
  # On a PR, prove the images build without publishing them.
  # ---------------------------------------------------------------------------
  image-build-check:
    name: image builds (${{ matrix.service }})
    needs: gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [relayer, indexer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha

  # ---------------------------------------------------------------------------
  # What actually went live.
  # ---------------------------------------------------------------------------
  summary:
    name: summary
    needs: [frontends, images]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Deployment"
            echo
            echo "| Target | Result |"
            echo "|---|---|"
            echo "| Frontends | ${{ needs.frontends.result }} |"
            echo "| Service images | ${{ needs.images.result }} |"
            echo
            echo "Contracts are **not** deployed by this workflow. Source"
            echo "registration writes trust decisions that fail silently when"
            echo "wrong, so it stays behind the manual trigger in \`deploy.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
